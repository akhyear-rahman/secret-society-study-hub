      <stop offset="0"  stop-color="#f0d67a"/>
      <stop offset=".45" stop-color="#d4af37"/>
      <stop offset="1"  stop-color="#9c7415"/>
    </linearGradient>
    <radialGradient id="ink" cx=".35" cy=".3" r=".85">
