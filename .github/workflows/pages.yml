name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fails the build on broken cross-references or invalid JSON, so a
      # typo in a content file can never take the live site down.
      - name: Validate content
        run: python tools/validate.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement:true switches the repo's Pages source to GitHub Actions if
      # it is not already set that way. Without it this step fails outright on
      # a repo still using the classic branch source, which is the default —
      # and the classic Jekyll build then serves whatever folder it was
      # pointed at, giving a 404 rather than an error anyone can act on.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
